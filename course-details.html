
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Details | Learning Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">
            <div>
                <h1 id="course-title">Loading course...</h1>
                <p id="course-instructor">Loading instructor...</p>
            </div>

            <button id="back-courses" type="button">
                ← Courses
            </button>
        </header>

        <section class="dashboard-content">

            <div class="welcome-card">
                <h2>📚 Course Overview</h2>
                <p id="course-description">
                    Loading course description...
                </p>
            </div>

            <div class="dashboard-card">
                <h3>📖 Course Lessons</h3>

                <p>Select a lesson below to start learning.</p>

                <div id="lessons-container">
                    <p>Loading lessons...</p>
                </div>
            </div>

        </section>

    </main>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",
            authDomain: "sch-m-system.firebaseapp.com",
            projectId: "sch-m-system",
            storageBucket: "sch-m-system.firebasestorage.app",
            messagingSenderId: "24559011089",
            appId: "1:24559011089:web:8009d445b45223b53e38b0",
            measurementId: "G-4J1V0208LJ"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        const courseTitle =
            document.getElementById("course-title");

        const courseInstructor =
            document.getElementById("course-instructor");

        const courseDescription =
            document.getElementById("course-description");

        const lessonsContainer =
            document.getElementById("lessons-container");


        const params =
            new URLSearchParams(window.location.search);

        const courseId = params.get("id");


        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.href = "index.html";
                return;
            }

            if (!courseId) {
                courseTitle.textContent = "Course not found";
                courseInstructor.textContent = "";
                courseDescription.textContent =
                    "No course ID was provided.";
                lessonsContainer.replaceChildren();
                return;
            }

            try {

                // LOAD COURSE DETAILS

                const courseSnapshot = await getDoc(
                    doc(db, "courses", courseId)
                );

                if (!courseSnapshot.exists()) {

                    courseTitle.textContent = "Course not found";
                    courseInstructor.textContent = "";
                    courseDescription.textContent =
                        "This course does not exist.";

                    lessonsContainer.replaceChildren();
                    return;
                }

                const course = courseSnapshot.data();

                courseTitle.textContent =
                    "📚 " + (course.title || "Untitled Course");

                // Read the instructor name using the correct Firestore field.
                let instructorName =
                    course.instructorName ||
                    course.instructor ||
                    "";

                // If the course has no saved name, try the instructor's profile.
                if (!instructorName && course.instructorId) {

                    const instructorSnapshot = await getDoc(
                        doc(db, "users", course.instructorId)
                    );

                    if (instructorSnapshot.exists()) {

                        const instructorData =
                            instructorSnapshot.data();

                        instructorName =
                            instructorData.name ||
                            instructorData.displayName ||
                            "";

                    }
                }

                courseInstructor.textContent =
                    "👨‍🏫 Instructor: " +
                    (instructorName || "Name unavailable");

                courseDescription.textContent =
                    course.description ||
                    "No course description available.";


                // LOAD LESSONS FOR THIS COURSE

                const lessonsQuery = query(
                    collection(db, "lessons"),
                    where("courseId", "==", courseId)
                );

                const lessonsSnapshot =
                    await getDocs(lessonsQuery);

                lessonsContainer.replaceChildren();

                if (lessonsSnapshot.empty) {

                    const message = document.createElement("p");

                    message.textContent =
                        "No lessons yet. Your instructor will add lessons here.";

                    lessonsContainer.appendChild(message);
                    return;
                }


                // SORT LESSONS BY LESSON NUMBER

                const lessons = lessonsSnapshot.docs.sort(
                    (a, b) => {

                        const numberA = Number(
                            a.data().lessonNumber || 0
                        );

                        const numberB = Number(
                            b.data().lessonNumber || 0
                        );

                        return numberA - numberB;
                    }
                );


                // DISPLAY EACH LESSON

                lessons.forEach((lessonDoc) => {

                    const lesson = lessonDoc.data();

                    const lessonCard =
                        document.createElement("div");

                    lessonCard.className = "dashboard-card";
                    lessonCard.style.marginTop = "18px";


                    const title =
                        document.createElement("h3");

                    title.textContent =
                        "📖 " +
                        (lesson.lessonNumber
                            ? "Lesson " + lesson.lessonNumber + ": "
                            : "") +
                        (lesson.title || "Untitled Lesson");


                    const preview =
                        document.createElement("p");

                    const content = lesson.content || "";

                    preview.textContent =
                        content.length > 150
                            ? content.substring(0, 150) + "..."
                            : content ||
                              "No lesson description available.";


                    const button =
                        document.createElement("button");

                    button.type = "button";
                    button.textContent = "Open Lesson →";


                    button.addEventListener("click", () => {

                        window.location.href =
                            "lesson.html?id=" +
                            encodeURIComponent(lessonDoc.id);

                    });


                    lessonCard.appendChild(title);
                    lessonCard.appendChild(preview);
                    lessonCard.appendChild(button);

                    lessonsContainer.appendChild(lessonCard);

                });


            } catch (error) {

                console.error("Error loading course:", error);

                lessonsContainer.replaceChildren();

                const message = document.createElement("p");

                message.textContent =
                    "Unable to load the course. Check your connection and try again.";

                lessonsContainer.appendChild(message);

            }

        });


        document
            .getElementById("back-courses")
            .addEventListener("click", () => {

                window.location.href = "courses.html";

            });

    </script>

</body>
</html>
