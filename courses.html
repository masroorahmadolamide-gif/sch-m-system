
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses | Learning Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">

            <div>
                <h1>📚 My Courses</h1>
                <p>Learn at your own pace.</p>
            </div>

            <button id="back-dashboard" type="button">
                ← Dashboard
            </button>

        </header>


        <section class="dashboard-content">

            <div class="welcome-card">
                <h2>Your Learning Journey 🚀</h2>
                <p>Choose a course and continue learning.</p>
            </div>

            <div id="courses-container" class="dashboard-grid">

                <div class="dashboard-card">
                    <h3>Loading courses...</h3>
                    <p>Please wait while we load your courses.</p>
                </div>

            </div>

        </section>

    </main>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",
            authDomain: "sch-m-system.firebaseapp.com",
            projectId: "sch-m-system",
            storageBucket: "sch-m-system.firebasestorage.app",
            messagingSenderId: "24559011089",
            appId: "1:24559011089:web:8009d445b45223b53e38b0",
            measurementId: "G-4J1V0208LJ"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        const coursesContainer =
            document.getElementById("courses-container");


        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.href = "index.html";
                return;
            }

            await loadCourses(user.uid);

        });


        async function loadCourses(userId) {

            coursesContainer.innerHTML = "";

            try {

                const [
                    coursesSnapshot,
                    lessonsSnapshot,
                    progressSnapshot
                ] = await Promise.all([

                    getDocs(
                        collection(db, "courses")
                    ),

                    getDocs(
                        collection(db, "lessons")
                    ),

                    getDocs(
                        query(
                            collection(db, "lessonProgress"),
                            where("userId", "==", userId)
                        )
                    )

                ]);


                if (coursesSnapshot.empty) {

                    const card =
                        document.createElement("div");

                    card.className = "dashboard-card";

                    const title =
                        document.createElement("h3");

                    title.textContent = "No courses yet";

                    const text =
                        document.createElement("p");

                    text.textContent =
                        "Courses will appear here when instructors create them.";

                    card.append(title, text);

                    coursesContainer.appendChild(card);

                    return;

                }


                // GROUP LESSONS BY COURSE

                const lessonsByCourse = new Map();

                lessonsSnapshot.forEach((lessonDoc) => {

                    const lesson = lessonDoc.data();

                    if (!lesson.courseId) return;

                    if (!lessonsByCourse.has(lesson.courseId)) {
                        lessonsByCourse.set(
                            lesson.courseId,
                            []
                        );
                    }

                    lessonsByCourse
                        .get(lesson.courseId)
                        .push({
                            id: lessonDoc.id,
                            ...lesson
                        });

                });


                // GROUP COMPLETED LESSONS BY COURSE

                const completedByCourse = new Map();

                progressSnapshot.forEach((progressDoc) => {

                    const progress = progressDoc.data();

                    if (
                        progress.completed !== true ||
                        !progress.courseId ||
                        !progress.lessonId
                    ) {
                        return;
                    }

                    if (!completedByCourse.has(progress.courseId)) {
                        completedByCourse.set(
                            progress.courseId,
                            new Set()
                        );
                    }

                    completedByCourse
                        .get(progress.courseId)
                        .add(progress.lessonId);

                });


                // DISPLAY EACH COURSE

                coursesSnapshot.forEach((courseDoc) => {

                    const course = courseDoc.data();

                    const courseId = courseDoc.id;

                    const courseLessons =
                        lessonsByCourse.get(courseId) || [];

                    const completedLessons =
                        completedByCourse.get(courseId) || new Set();


                    // Count only completed lessons
                    // that actually belong to this course.

                    const totalLessons = courseLessons.length;

                    const completedCount =
                        courseLessons.filter(
                            lesson =>
                                completedLessons.has(lesson.id)
                        ).length;


                    const percentage = totalLessons > 0
                        ? Math.round(
                            (completedCount / totalLessons) * 100
                        )
                        : 0;


                    const card =
                        document.createElement("div");

                    card.className = "dashboard-card course-card";


                    const title =
                        document.createElement("h3");

                    title.textContent =
                        `📚 ${course.title || "Untitled Course"}`;


                    const description =
                        document.createElement("p");

                    description.textContent =
                        course.description ||
                        "No course description available.";


                    const instructor =
                        document.createElement("p");

                    instructor.className = "course-instructor";

                    instructor.textContent =
                        `👨‍🏫 Instructor: ${
                            course.instructor || "Not assigned"
                        }`;


                    // PROGRESS SECTION

                    const progressSection =
                        document.createElement("div");

                    progressSection.className =
                        "course-progress-section";


                    const progressInfo =
                        document.createElement("div");

                    progressInfo.className =
                        "course-progress-info";


                    const progressLabel =
                        document.createElement("span");

                    progressLabel.textContent =
                        "Your progress";


                    const progressPercentage =
                        document.createElement("strong");

                    progressPercentage.textContent =
                        `${percentage}%`;


                    progressInfo.append(
                        progressLabel,
                        progressPercentage
                    );


                    const progressTrack =
                        document.createElement("div");

                    progressTrack.className =
                        "progress-track";


                    progressTrack.setAttribute(
                        "role",
                        "progressbar"
                    );

                    progressTrack.setAttribute(
                        "aria-valuemin",
                        "0"
                    );

                    progressTrack.setAttribute(
                        "aria-valuemax",
                        "100"
                    );

                    progressTrack.setAttribute(
                        "aria-valuenow",
                        String(percentage)
                    );


                    const progressBar =
                        document.createElement("div");

                    progressBar.className =
                        "progress-bar";

                    progressBar.style.width =
                        `${percentage}%`;


                    progressTrack.appendChild(
                        progressBar
                    );


                    const progressCount =
                        document.createElement("p");

                    progressCount.className =
                        "course-progress-count";


                    if (totalLessons === 0) {

                        progressCount.textContent =
                            "No lessons available yet.";

                    } else {

                        progressCount.textContent =
                            `${completedCount} of ${totalLessons} lessons completed`;

                    }


                    progressSection.append(
                        progressInfo,
                        progressTrack,
                        progressCount
                    );


                    // OPEN COURSE BUTTON

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.textContent =
                        "Open Course →";


                    button.addEventListener("click", () => {

                        window.location.href =
                            `course-details.html?id=${encodeURIComponent(courseId)}`;

                    });


                    card.append(
                        title,
                        description,
                        instructor,
                        progressSection,
                        button
                    );


                    coursesContainer.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Error loading courses and progress:",
                    error
                );

                coursesContainer.innerHTML = "";

                const errorCard =
                    document.createElement("div");

                errorCard.className = "dashboard-card";

                const title =
                    document.createElement("h3");

                title.textContent =
                    "Unable to load courses";


                const text =
                    document.createElement("p");

                text.textContent =
                    "Please check your internet connection and Firebase permissions, then refresh the page.";


                errorCard.append(title, text);

                coursesContainer.appendChild(errorCard);

            }

        }


        document
            .getElementById("back-dashboard")
            .addEventListener("click", () => {

                window.location.href = "dashboard.html";

            });

    </script>

</body>

</html>
