
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classora - Courses</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="dashboard">

        <!-- HEADER -->
        <header class="dashboard-header">

            <div>

                <h1>📚 My Courses</h1>

                <p>
                    Explore your available courses and start learning.
                </p>

            </div>

            <button id="back-dashboard">
                ← Dashboard
            </button>

        </header>


        <!-- CONTENT -->
        <section class="dashboard-content">

            <!-- WELCOME -->
            <div class="welcome-card">

                <h2>
                    Available Courses 📚
                </h2>

                <p>
                    Choose a course below and start learning with Classora.
                </p>

            </div>


            <!-- COURSES -->
            <div
                id="courses-container"
                class="dashboard-grid"
            >

                <div class="dashboard-card">

                    <h3>
                        Loading courses...
                    </h3>

                    <p>
                        Please wait while we load your courses.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- FIREBASE -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =============================
        // FIREBASE CONFIG
        // =============================

        const firebaseConfig = {

            apiKey:
                "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",

            authDomain:
                "sch-m-system.firebaseapp.com",

            projectId:
                "sch-m-system",

            storageBucket:
                "sch-m-system.firebasestorage.app",

            messagingSenderId:
                "24559011089",

            appId:
                "1:24559011089:web:8009d445b45223b53e38b0",

            measurementId:
                "G-4J1V0208LJ"

        };


        // =============================
        // INITIALIZE FIREBASE
        // =============================

        const app =
            initializeApp(
                firebaseConfig
            );

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        // =============================
        // ELEMENTS
        // =============================

        const coursesContainer =
            document.getElementById(
                "courses-container"
            );


        const backDashboard =
            document.getElementById(
                "back-dashboard"
            );


        // =============================
        // LOAD COURSES
        // =============================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                try {

                    coursesContainer.innerHTML = `
                        <div class="dashboard-card">

                            <h3>
                                Loading courses...
                            </h3>

                            <p>
                                Please wait.
                            </p>

                        </div>
                    `;


                    const coursesSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "courses"
                            )
                        );


                    coursesContainer.innerHTML =
                        "";


                    // =============================
                    // NO COURSES
                    // =============================

                    if (
                        coursesSnapshot.empty
                    ) {

                        coursesContainer.innerHTML = `
                            <div class="dashboard-card">

                                <h3>
                                    No courses yet 📚
                                </h3>

                                <p>
                                    Courses created by instructors will appear here.
                                </p>

                            </div>
                        `;

                        return;

                    }


                    // =============================
                    // DISPLAY COURSES
                    // =============================

                    coursesSnapshot.forEach(
                        (courseDoc) => {

                            const course =
                                courseDoc.data();


                            // COURSE CARD

                            const card =
                                document.createElement(
                                    "div"
                                );

                            card.className =
                                "dashboard-card";


                            // COURSE TITLE

                            const title =
                                document.createElement(
                                    "h3"
                                );

                            title.textContent =
                                `📚 ${
                                    course.title ||
                                    "Untitled Course"
                                }`;


                            // DESCRIPTION

                            const description =
                                document.createElement(
                                    "p"
                                );

                            description.textContent =
                                course.description ||
                                "No description available.";


                            // INSTRUCTOR

                            const instructor =
                                document.createElement(
                                    "p"
                                );

                            instructor.textContent =
                                `👨‍🏫 Instructor: ${
                                    course.instructorName ||
                                    "Not assigned"
                                }`;


                            // COURSE BUTTON

                            const button =
                                document.createElement(
                                    "button"
                                );

                            button.textContent =
                                "Open Course →";


                            button.addEventListener(
                                "click",
                                () => {

                                    window.location.href =
                                        `course-details.html?id=${courseDoc.id}`;

                                }
                            );


                            // APPEND CONTENT

                            card.appendChild(
                                title
                            );

                            card.appendChild(
                                description
                            );

                            card.appendChild(
                                instructor
                            );

                            card.appendChild(
                                button
                            );


                            coursesContainer.appendChild(
                                card
                            );

                        }
                    );


                } catch (error) {

                    console.error(
                        "Error loading courses:",
                        error
                    );


                    coursesContainer.innerHTML = `
                        <div class="dashboard-card">

                            <h3>
                                Unable to load courses ❌
                            </h3>

                            <p>
                                Something went wrong while loading the courses.
                            </p>

                            <p>
                                Please refresh the page and try again.
                            </p>

                        </div>
                    `;

                }

            }
        );


        // =============================
        // BACK TO DASHBOARD
        // =============================

        backDashboard.addEventListener(
            "click",
            () => {

                window.location.href =
                    "dashboard.html";

            }
        );

    </script>

</body>

</html>
```
