
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses | Learning Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <!-- HEADER -->
        <header class="dashboard-header">

            <div>
                <h1>📚 My Courses</h1>
                <p>Learn at your own pace.</p>
            </div>

            <button id="back-dashboard" type="button">
                ← Dashboard
            </button>

        </header>


        <!-- COURSE CONTENT -->
        <section class="dashboard-content">

            <div class="welcome-card">
                <h2>Your Learning Journey 🚀</h2>
                <p>Choose a course and continue learning.</p>
            </div>

            <div id="courses-container" class="dashboard-grid">

                <div class="dashboard-card">
                    <h3>Loading courses...</h3>
                    <p>Please wait while we load your courses.</p>
                </div>

            </div>

        </section>

    </main>


    <!-- FIREBASE -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            query,
            where,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =====================================
        // FIREBASE CONFIGURATION
        // =====================================

        const firebaseConfig = {
            apiKey: "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",
            authDomain: "sch-m-system.firebaseapp.com",
            projectId: "sch-m-system",
            storageBucket: "sch-m-system.firebasestorage.app",
            messagingSenderId: "24559011089",
            appId: "1:24559011089:web:8009d445b45223b53e38b0",
            measurementId: "G-4J1V0208LJ"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const coursesContainer =
            document.getElementById("courses-container");


        // =====================================
        // AUTHENTICATION
        // =====================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.replace("index.html");
                return;
            }

            try {

                // Make sure the signed-in account is a student.
                const userSnap = await getDoc(
                    doc(db, "users", user.uid)
                );

                if (!userSnap.exists()) {
                    coursesContainer.innerHTML =
                        "<div class='dashboard-card'><h3>Profile not found</h3><p>Your account profile could not be found.</p></div>";
                    return;
                }

                const userData = userSnap.data();

                if (userData.role !== "student") {
                    coursesContainer.innerHTML =
                        "<div class='dashboard-card'><h3>Student access only</h3><p>Please log in with a student account to view courses.</p></div>";
                    return;
                }

                await loadCourses(user.uid);

            } catch (error) {

                console.error("Authentication error:", error);

                showPageMessage(
                    "Unable to verify your account. Please refresh and try again."
                );

            }

        });


        // =====================================
        // PAGE MESSAGE
        // =====================================

        function showPageMessage(message) {

            coursesContainer.innerHTML = "";

            const card = document.createElement("div");
            card.className = "dashboard-card";

            const text = document.createElement("p");
            text.textContent = message;

            card.appendChild(text);
            coursesContainer.appendChild(card);

        }


        // =====================================
        // LOAD COURSES
        // =====================================

        async function loadCourses(userId) {

            coursesContainer.innerHTML =
                "<div class='dashboard-card'><h3>Loading courses...</h3><p>Please wait.</p></div>";

            try {

                const [
                    coursesSnapshot,
                    lessonsSnapshot,
                    progressSnapshot
                ] = await Promise.all([

                    getDocs(collection(db, "courses")),

                    getDocs(collection(db, "lessons")),

                    getDocs(
                        query(
                            collection(db, "lessonProgress"),
                            where("userId", "==", userId)
                        )
                    )

                ]);


                coursesContainer.innerHTML = "";


                // =====================================
                // NO COURSES
                // =====================================

                if (coursesSnapshot.empty) {

                    const card = document.createElement("div");
                    card.className = "dashboard-card";

                    const title = document.createElement("h3");
                    title.textContent = "No courses yet";

                    const text = document.createElement("p");
                    text.textContent =
                        "Courses will appear here when instructors create them.";

                    card.append(title, text);
                    coursesContainer.appendChild(card);

                    return;

                }


                // =====================================
                // GROUP LESSONS BY COURSE
                // =====================================

                const lessonsByCourse = new Map();

                lessonsSnapshot.forEach((lessonDoc) => {

                    const lesson = lessonDoc.data();

                    if (!lesson.courseId) return;

                    if (!lessonsByCourse.has(lesson.courseId)) {
                        lessonsByCourse.set(lesson.courseId, []);
                    }

                    lessonsByCourse.get(lesson.courseId).push({
                        id: lessonDoc.id,
                        ...lesson
                    });

                });


                // =====================================
                // GROUP COMPLETED LESSONS BY COURSE
                // =====================================

                const completedByCourse = new Map();

                progressSnapshot.forEach((progressDoc) => {

                    const progress = progressDoc.data();

                    if (
                        progress.completed !== true ||
                        !progress.lessonId
                    ) {
                        return;
                    }

                    // Prefer the course ID stored with progress.
                    // If it is missing, derive it from the lesson.
                    let courseId = progress.courseId;

                    if (!courseId) {

                        const matchingLesson =
                            lessonsSnapshot.docs.find(
                                lessonDoc =>
                                    lessonDoc.id === progress.lessonId
                            );

                        if (matchingLesson) {
                            courseId = matchingLesson.data().courseId;
                        }

                    }

                    if (!courseId) return;

                    if (!completedByCourse.has(courseId)) {
                        completedByCourse.set(courseId, new Set());
                    }

                    completedByCourse
                        .get(courseId)
                        .add(progress.lessonId);

                });


                // =====================================
                // DISPLAY EACH COURSE
                // =====================================

                coursesSnapshot.forEach((courseDoc) => {

                    const course = courseDoc.data();
                    const courseId = courseDoc.id;

                    const courseLessons =
                        lessonsByCourse.get(courseId) || [];

                    const completedLessons =
                        completedByCourse.get(courseId) || new Set();


                    // COURSE PROGRESS

                    const totalLessons = courseLessons.length;

                    const completedCount =
                        courseLessons.filter(
                            lesson => completedLessons.has(lesson.id)
                        ).length;

                    const percentage = totalLessons > 0
                        ? Math.round(
                            (completedCount / totalLessons) * 100
                        )
                        : 0;


                    // =====================================
                    // COURSE CARD
                    // =====================================

                    const card = document.createElement("div");
                    card.className = "dashboard-card course-card";


                    // COURSE TITLE

                    const title = document.createElement("h3");

                    title.textContent =
                        "📚 " + (course.title || "Untitled Course");


                    // COURSE DESCRIPTION

                    const description = document.createElement("p");

                    description.textContent =
                        course.description ||
                        "No course description available.";


                    // =====================================
                    // INSTRUCTOR NAME
                    // =====================================

                    const instructor = document.createElement("p");

                    instructor.className = "course-instructor";

                    instructor.style.margin = "12px 0";
                    instructor.style.padding = "10px 12px";
                    instructor.style.background = "#fff3e8";
                    instructor.style.color = "#9a4300";
                    instructor.style.borderRadius = "8px";
                    instructor.style.fontSize = "14px";


                    // The instructor dashboard saves instructorName.
                    // Support the older instructor field as well.

                    let instructorName =
                        typeof course.instructorName === "string"
                            ? course.instructorName.trim()
                            : "";

                    if (!instructorName && typeof course.instructor === "string") {
                        instructorName = course.instructor.trim();
                    }

                    instructor.textContent =
                        "👨‍🏫 Instructor: " +
                        (instructorName || "Instructor name unavailable");


                    // =====================================
                    // PROGRESS SECTION
                    // =====================================

                    const progressSection =
                        document.createElement("div");

                    progressSection.className =
                        "course-progress-section";


                    const progressInfo =
                        document.createElement("div");

                    progressInfo.className =
                        "course-progress-info";


                    const progressLabel =
                        document.createElement("span");

                    progressLabel.textContent = "Your progress";


                    const progressPercentage =
                        document.createElement("strong");

                    progressPercentage.textContent =
                        percentage + "%";


                    progressInfo.append(
                        progressLabel,
                        progressPercentage
                    );


                    const progressTrack =
                        document.createElement("div");

                    progressTrack.className = "progress-track";

                    progressTrack.setAttribute("role", "progressbar");
                    progressTrack.setAttribute("aria-label", "Course lesson completion");
                    progressTrack.setAttribute("aria-valuemin", "0");
                    progressTrack.setAttribute("aria-valuemax", "100");
                    progressTrack.setAttribute(
                        "aria-valuenow",
                        String(percentage)
                    );


                    const progressBar =
                        document.createElement("div");

                    progressBar.className = "progress-bar";
                    progressBar.style.width = percentage + "%";


                    progressTrack.appendChild(progressBar);


                    const progressCount =
                        document.createElement("p");

                    progressCount.className = "course-progress-count";

                    if (totalLessons === 0) {

                        progressCount.textContent =
                            "No lessons available yet.";

                    } else {

                        progressCount.textContent =
                            completedCount +
                            " of " +
                            totalLessons +
                            " lessons completed";

                    }


                    progressSection.append(
                        progressInfo,
                        progressTrack,
                        progressCount
                    );


                    // =====================================
                    // OPEN COURSE BUTTON
                    // =====================================

                    const button =
                        document.createElement("button");

                    button.type = "button";
                    button.textContent = "Open Course →";

                    button.addEventListener("click", () => {

                        window.location.href =
                            "course-details.html?id=" +
                            encodeURIComponent(courseId);

                    });


                    // ADD ELEMENTS TO CARD

                    card.append(
                        title,
                        description,
                        instructor,
                        progressSection,
                        button
                    );

                    coursesContainer.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Error loading courses and progress:",
                    error
                );

                showPageMessage(
                    "Unable to load courses. Please check your internet connection and Firebase permissions, then refresh the page."
                );

            }

        }


        // =====================================
        // BACK TO DASHBOARD
        // =====================================

        document
            .getElementById("back-dashboard")
            .addEventListener("click", () => {

                window.location.href = "dashboard.html";

            });

    </script>

</body>

</html>
