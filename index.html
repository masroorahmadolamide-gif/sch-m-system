
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classora | Learning Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- REGISTER PAGE -->
            <div id="register-section">

                 <!-- CLASSORA ;LOGO -->
                <div class="auth-logo">
                    <img
                        src="./image/WhatsApp Image 2026-10-15 at 07.01.33.jpeg"
                        alt="Classora Logo"
                    >
                </div>

                <h1>Create Account</h1>

                <p>Join the learning platform</p>

                <form id="register-form">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <label for="role">Account Type</label>

                    <select id="role">
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                    </select>

                    <button type="submit" id="register-btn">
                        Create Account
                    </button>

                </form>

                <p id="message"></p>

                <button
                    type="button"
                    id="show-login"
                    class="switch-btn"
                >
                    Already have an account? Log in
                </button>

            </div>


            <!-- LOGIN PAGE -->
            <div id="login-section" hidden>

                <!-- CLASSORA LOGO -->
                <div class="auth-logo">
                    <img
                        src="PUT-YOUR-LOGO-PATH-HERE"
                        alt="Classora Logo"
                    >
                </div>

                <h1>Welcome Back</h1>

                <p>Log in to your account</p>

                <form id="login-form">

                    <label for="login-email">Email</label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="login-password">Password</label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" id="login-btn">
                        Login
                    </button>

                </form>

                <p id="login-message"></p>

                <button
                    type="button"
                    id="show-register"
                    class="switch-btn"
                >
                    Don't have an account? Register
                </button>

            </div>

        </div>

    </main>

    <script type="module" src="app.js"></script>

</body>
</html>
