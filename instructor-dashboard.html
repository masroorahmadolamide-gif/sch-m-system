<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard-page">

        <!-- HEADER -->
        <header class="dashboard-header">
            <div>
                <h1>Instructor Dashboard</h1>
                <p id="instructor-name">Loading instructor...</p>
            </div>

            <button type="button" id="logout-btn">Logout</button>
        </header>

        <!-- WELCOME -->
        <section class="welcome-card">
            <h2 id="welcome-heading">Welcome, Instructor 👋</h2>
            <p>
                Create courses, add lessons and manage your learning content.
            </p>
        </section>

        <div class="dashboard-content">

            <!-- CREATE COURSE -->
            <section class="dashboard-card">
                <h3>Create New Course</h3>

                <form id="course-form">
                    <label for="course-title">Course Title</label>
                    <input
                        type="text"
                        id="course-title"
                        placeholder="e.g. Mathematics"
                        required
                    >

                    <label for="course-description">Course Description</label>
                    <textarea
                        id="course-description"
                        placeholder="Describe this course..."
                        required
                    ></textarea>

                    <button type="submit">Create Course</button>
                </form>

                <p id="course-message" role="status"></p>
            </section>

            <!-- MY COURSES -->
            <section class="dashboard-card">
                <h3>My Courses</h3>

                <div id="my-courses">
                    <p>Loading courses...</p>
                </div>
            </section>

            <!-- CREATE LESSON -->
            <section class="dashboard-card">
                <h3>Create New Lesson</h3>

                <form id="lesson-form">
                    <label for="course-select">Select Course</label>
                    <select id="course-select" required>
                        <option value="">Select a course</option>
                    </select>

                    <label for="lesson-title">Lesson Title</label>
                    <input
                        type="text"
                        id="lesson-title"
                        placeholder="e.g. Introduction to Mathematics"
                        required
                    >

                    <label for="lesson-content">Lesson Content</label>
                    <textarea
                        id="lesson-content"
                        placeholder="Write the lesson content here..."
                        required
                    ></textarea>

                    <button type="submit">Create Lesson</button>
                </form>

                <p id="lesson-message" role="status"></p>
            </section>

        </div>
    </main>

    <script type="module">

        // =====================================
        // FIREBASE IMPORTS
        // =====================================

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            updateDoc,
            deleteDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =====================================
        // FIREBASE CONFIGURATION
        // =====================================

        const firebaseConfig = {
            apiKey: "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",
            authDomain: "sch-m-system.firebaseapp.com",
            projectId: "sch-m-system",
            storageBucket: "sch-m-system.firebasestorage.app",
            messagingSenderId: "24559011089",
            appId: "1:24559011089:web:8009d445b45223b53e38b0",
            measurementId: "G-4J1V0208LJ"
        };


        // =====================================
        // INITIALIZE FIREBASE
        // =====================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        // =====================================
        // HTML ELEMENTS
        // =====================================

        const instructorName = document.getElementById("instructor-name");
        const welcomeHeading = document.getElementById("welcome-heading");
        const logoutBtn = document.getElementById("logout-btn");

        const courseForm = document.getElementById("course-form");
        const courseTitle = document.getElementById("course-title");
        const courseDescription = document.getElementById("course-description");
        const courseMessage = document.getElementById("course-message");
        const myCourses = document.getElementById("my-courses");

        const courseSelect = document.getElementById("course-select");

        const lessonForm = document.getElementById("lesson-form");
        const lessonTitle = document.getElementById("lesson-title");
        const lessonContent = document.getElementById("lesson-content");
        const lessonMessage = document.getElementById("lesson-message");


        // =====================================
        // CURRENT INSTRUCTOR
        // =====================================

        let currentUser = null;
        let currentInstructorName = "Instructor";


        // =====================================
        // DISPLAY MESSAGES SAFELY
        // =====================================

        function showMessage(element, message, isError = false) {
            element.textContent = message;
            element.style.color = isError ? "#d60000" : "#16803d";
        }


        // =====================================
        // AUTHENTICATION AND INSTRUCTOR PROFILE
        // =====================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.replace("index.html");
                return;
            }

            currentUser = user;

            try {

                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    instructorName.textContent = "Profile not found";

                    alert(
                        "Your user profile was not found in Firestore. " +
                        "Please check the users collection in Firebase."
                    );

                    await signOut(auth);
                    window.location.replace("index.html");
                    return;
                }

                const userData = userSnap.data();

                // Only instructors can access this dashboard.
                if (userData.role !== "instructor") {
                    alert("You do not have instructor access.");
                    window.location.replace("dashboard.html");
                    return;
                }

                // Use the saved Firestore name first.
                const savedName =
                    typeof userData.name === "string"
                        ? userData.name.trim()
                        : "";

                currentInstructorName =
                    savedName ||
                    user.displayName ||
                    user.email?.split("@")[0] ||
                    "Instructor";

                // Display the name in the header.
                instructorName.textContent =
                    "Logged in as " + currentInstructorName;

                // Display the name in the welcome section.
                welcomeHeading.textContent =
                    "Welcome, " + currentInstructorName + " 👋";

                // Load the instructor's courses.
                await loadCourses(user.uid);

            } catch (error) {

                console.error("Authentication error:", error);

                instructorName.textContent =
                    "Unable to load instructor profile";

                alert(
                    "Unable to load your instructor profile. " +
                    "Please check your internet connection and Firebase permissions."
                );
            }
        });


        // =====================================
        // LOGOUT
        // =====================================

        logoutBtn.addEventListener("click", async () => {

            try {
                await signOut(auth);
                window.location.replace("index.html");

            } catch (error) {
                console.error("Logout error:", error);
                alert("Unable to log out. Please try again.");
            }
        });


        // =====================================
        // CREATE COURSE
        // =====================================

        courseForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (!currentUser) {
                showMessage(courseMessage, "Please log in first.", true);
                return;
            }

            const title = courseTitle.value.trim();
            const description = courseDescription.value.trim();

            if (!title || !description) {
                showMessage(
                    courseMessage,
                    "Please fill in all course fields.",
                    true
                );
                return;
            }

            try {

                showMessage(courseMessage, "Creating course...");

                await addDoc(collection(db, "courses"), {
                    title: title,
                    description: description,
                    instructorId: currentUser.uid,
                    instructorName: currentInstructorName,
                    createdAt: serverTimestamp()
                });

                showMessage(
                    courseMessage,
                    "Course created successfully! ✅"
                );

                courseForm.reset();

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error creating course:", error);

                showMessage(
                    courseMessage,
                    "Unable to create course: " + error.message,
                    true
                );
            }
        });


        // =====================================
        // LOAD INSTRUCTOR COURSES
        // =====================================

        async function loadCourses(instructorId) {

            myCourses.innerHTML = "<p>Loading courses...</p>";

            courseSelect.innerHTML =
                '<option value="">Select a course</option>';

            try {

                const coursesQuery = query(
                    collection(db, "courses"),
                    where("instructorId", "==", instructorId)
                );

                const snapshot = await getDocs(coursesQuery);

                myCourses.innerHTML = "";

                if (snapshot.empty) {

                    myCourses.innerHTML = `
                        <div class="no-lessons">
                            You have not created any courses yet.
                        </div>
                    `;

                    return;
                }

                // Use a loop so asynchronous lesson loading finishes correctly.
                for (const courseDoc of snapshot.docs) {

                    const course = courseDoc.data();

                    // -----------------------------
                    // COURSE CARD
                    // -----------------------------

                    const courseCard = document.createElement("div");
                    courseCard.className = "dashboard-card";

                    const title = document.createElement("h3");
                    title.textContent = course.title || "Untitled Course";

                    const description = document.createElement("p");
                    description.textContent =
                        course.description || "No description available.";

                    courseCard.appendChild(title);
                    courseCard.appendChild(description);


                    // -----------------------------
                    // COURSE ACTIONS
                    // -----------------------------

                    const courseActions = document.createElement("div");
                    courseActions.className = "course-actions";

                    // EDIT COURSE
                    const editCourseButton = document.createElement("button");
                    editCourseButton.type = "button";
                    editCourseButton.textContent = "✏️ Edit Course";

                    editCourseButton.addEventListener("click", async () => {

                        const newTitle = prompt(
                            "Enter the new course title:",
                            course.title || ""
                        );

                        if (newTitle === null) return;

                        const newDescription = prompt(
                            "Enter the new course description:",
                            course.description || ""
                        );

                        if (newDescription === null) return;

                        const cleanTitle = newTitle.trim();
                        const cleanDescription = newDescription.trim();

                        if (!cleanTitle || !cleanDescription) {
                            alert("Course title and description cannot be empty.");
                            return;
                        }

                        await editCourse(
                            courseDoc.id,
                            cleanTitle,
                            cleanDescription
                        );
                    });

                    courseActions.appendChild(editCourseButton);


                    // DELETE COURSE
                    const deleteCourseButton = document.createElement("button");
                    deleteCourseButton.type = "button";
                    deleteCourseButton.textContent = "🗑️ Delete Course";

                    deleteCourseButton.addEventListener("click", async () => {

                        const confirmed = confirm(
                            'Are you sure you want to delete "' +
                            (course.title || "this course") +
                            '"? This will not automatically delete its lessons.'
                        );

                        if (!confirmed) return;

                        await deleteCourse(courseDoc.id);
                    });

                    courseActions.appendChild(deleteCourseButton);
                    courseCard.appendChild(courseActions);


                    // -----------------------------
                    // COURSE LESSONS
                    // -----------------------------

                    const lessonsContainer = document.createElement("div");
                    lessonsContainer.className = "instructor-lessons";

                    const lessonsHeading = document.createElement("strong");
                    lessonsHeading.textContent = "Lessons";

                    lessonsContainer.appendChild(lessonsHeading);

                    try {

                        const lessonsQuery = query(
                            collection(db, "lessons"),
                            where("courseId", "==", courseDoc.id),
                            where("instructorId", "==", instructorId)
                        );

                        const lessonsSnapshot = await getDocs(lessonsQuery);

                        if (lessonsSnapshot.empty) {

                            const noLessons = document.createElement("p");
                            noLessons.className = "no-lessons";
                            noLessons.textContent = "No lessons created yet.";

                            lessonsContainer.appendChild(noLessons);

                        } else {

                            for (const lessonDoc of lessonsSnapshot.docs) {

                                const lesson = lessonDoc.data();

                                const lessonItem = document.createElement("div");
                                lessonItem.className = "instructor-lesson-item";

                                const lessonHeading = document.createElement("strong");
                                lessonHeading.textContent =
                                    lesson.title || "Untitled Lesson";

                                const lessonPreview = document.createElement("p");

                                const preview = lesson.content || "";

                                lessonPreview.textContent =
                                    preview.length > 120
                                        ? preview.substring(0, 120) + "..."
                                        : preview;

                                const lessonActions = document.createElement("div");
                                lessonActions.style.marginTop = "12px";


                                // OPEN LESSON
                                const openLessonButton =
                                    document.createElement("button");

                                openLessonButton.type = "button";
                                openLessonButton.textContent = "Open Lesson →";

                                openLessonButton.addEventListener("click", () => {
                                    window.location.href =
                                        "lesson.html?id=" +
                                        encodeURIComponent(lessonDoc.id);
                                });

                                lessonActions.appendChild(openLessonButton);


                                // EDIT LESSON
                                const editLessonButton =
                                    document.createElement("button");

                                editLessonButton.type = "button";
                                editLessonButton.textContent = "✏️ Edit Lesson";
                                editLessonButton.style.marginLeft = "8px";

                                editLessonButton.addEventListener(
                                    "click",
                                    async () => {

                                        const newTitle = prompt(
                                            "Enter the new lesson title:",
                                            lesson.title || ""
                                        );

                                        if (newTitle === null) return;

                                        const newContent = prompt(
                                            "Enter the new lesson content:",
                                            lesson.content || ""
                                        );

                                        if (newContent === null) return;

                                        const cleanTitle = newTitle.trim();
                                        const cleanContent = newContent.trim();

                                        if (!cleanTitle || !cleanContent) {
                                            alert(
                                                "Lesson title and content cannot be empty."
                                            );
                                            return;
                                        }

                                        await editLesson(
                                            lessonDoc.id,
                                            cleanTitle,
                                            cleanContent
                                        );
                                    }
                                );

                                lessonActions.appendChild(editLessonButton);


                                // DELETE LESSON
                                const deleteLessonButton =
                                    document.createElement("button");

                                deleteLessonButton.type = "button";
                                deleteLessonButton.textContent = "🗑️ Delete Lesson";
                                deleteLessonButton.style.marginLeft = "8px";

                                deleteLessonButton.addEventListener(
                                    "click",
                                    async () => {

                                        const confirmed = confirm(
                                            'Are you sure you want to delete "' +
                                            (lesson.title || "this lesson") +
                                            '"?'
                                        );

                                        if (!confirmed) return;

                                        await deleteLesson(lessonDoc.id);
                                    }
                                );

                                lessonActions.appendChild(deleteLessonButton);

                                lessonItem.appendChild(lessonHeading);
                                lessonItem.appendChild(lessonPreview);
                                lessonItem.appendChild(lessonActions);

                                lessonsContainer.appendChild(lessonItem);
                            }
                        }

                    } catch (error) {

                        console.error("Error loading lessons:", error);

                        const errorMessage = document.createElement("p");
                        errorMessage.textContent =
                            "Unable to load lessons. Check your Firestore permissions or indexes.";

                        lessonsContainer.appendChild(errorMessage);
                    }

                    courseCard.appendChild(lessonsContainer);
                    myCourses.appendChild(courseCard);


                    // -----------------------------
                    // ADD COURSE TO LESSON SELECT
                    // -----------------------------

                    const option = document.createElement("option");
                    option.value = courseDoc.id;
                    option.textContent = course.title || "Untitled Course";

                    courseSelect.appendChild(option);
                }

            } catch (error) {

                console.error("Error loading courses:", error);

                myCourses.innerHTML =
                    "<p>Unable to load courses. Please check your Firebase permissions.</p>";

                showMessage(
                    courseMessage,
                    "Error loading courses: " + error.message,
                    true
                );
            }
        }


        // =====================================
        // EDIT COURSE
        // =====================================

        async function editCourse(courseId, newTitle, newDescription) {

            try {

                showMessage(courseMessage, "Updating course...");

                await updateDoc(doc(db, "courses", courseId), {
                    title: newTitle,
                    description: newDescription
                });

                showMessage(
                    courseMessage,
                    "Course updated successfully! ✅"
                );

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error updating course:", error);

                showMessage(
                    courseMessage,
                    "Unable to update course: " + error.message,
                    true
                );
            }
        }


        // =====================================
        // DELETE COURSE
        // =====================================

        async function deleteCourse(courseId) {

            try {

                showMessage(courseMessage, "Deleting course...");

                await deleteDoc(doc(db, "courses", courseId));

                showMessage(
                    courseMessage,
                    "Course deleted successfully! ✅"
                );

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error deleting course:", error);

                showMessage(
                    courseMessage,
                    "Unable to delete course: " + error.message,
                    true
                );
            }
        }


        // =====================================
        // EDIT LESSON
        // =====================================

        async function editLesson(lessonId, newTitle, newContent) {

            try {

                showMessage(lessonMessage, "Updating lesson...");

                await updateDoc(doc(db, "lessons", lessonId), {
                    title: newTitle,
                    content: newContent
                });

                showMessage(
                    lessonMessage,
                    "Lesson updated successfully! ✅"
                );

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error updating lesson:", error);

                showMessage(
                    lessonMessage,
                    "Unable to update lesson: " + error.message,
                    true
                );
            }
        }


        // =====================================
        // DELETE LESSON
        // =====================================

        async function deleteLesson(lessonId) {

            try {

                showMessage(lessonMessage, "Deleting lesson...");

                await deleteDoc(doc(db, "lessons", lessonId));

                showMessage(
                    lessonMessage,
                    "Lesson deleted successfully! ✅"
                );

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error deleting lesson:", error);

                showMessage(
                    lessonMessage,
                    "Unable to delete lesson: " + error.message,
                    true
                );
            }
        }


        // =====================================
        // CREATE LESSON
        // =====================================

        lessonForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (!currentUser) {
                showMessage(lessonMessage, "Please log in first.", true);
                return;
            }

            const selectedCourse = courseSelect.value;
            const title = lessonTitle.value.trim();
            const content = lessonContent.value.trim();

            if (!selectedCourse || !title || !content) {
                showMessage(
                    lessonMessage,
                    "Please fill in all lesson fields.",
                    true
                );
                return;
            }

            try {

                showMessage(lessonMessage, "Creating lesson...");

                await addDoc(collection(db, "lessons"), {
                    courseId: selectedCourse,
                    title: title,
                    content: content,
                    instructorId: currentUser.uid,
                    instructorName: currentInstructorName,
                    createdAt: serverTimestamp()
                });

                showMessage(
                    lessonMessage,
                    "Lesson created successfully! ✅"
                );

                lessonForm.reset();

                await loadCourses(currentUser.uid);

            } catch (error) {

                console.error("Error creating lesson:", error);

                showMessage(
                    lessonMessage,
                    "Unable to create lesson: " + error.message,
                    true
                );
            }
        });

    </script>

</body>
</html>
