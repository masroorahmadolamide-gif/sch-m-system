
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lesson</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="lesson-page">

        <a
            href="#"
            class="lesson-back-btn"
            id="back-btn"
        >
            ← Back
        </a>


        <section class="lesson-header">

            <div class="course-name" id="course-name">
                Loading course...
            </div>

            <h1 id="lesson-title">
                Loading lesson...
            </h1>

            <p
                class="lesson-instructor"
                id="lesson-instructor"
            >
            </p>

        </section>


        <section class="lesson-content">

            <p id="lesson-status">
                Loading lesson...
            </p>

            <div id="lesson-content">
            </div>

        </section>

    </main>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        /* ============================= */
        /* FIREBASE CONFIG */
        /* ============================= */

        const firebaseConfig = {

            apiKey: "AIzaSyC5AIhj-oze4EDIdgEc0QgMqgn-2GmRPu8",

            authDomain: "sch-m-system.firebaseapp.com",

            projectId: "sch-m-system",

            storageBucket: "sch-m-system.firebasestorage.app",

            messagingSenderId: "24559011089",

            appId: "1:24559011089:web:8009d445b45223b53e38b0",

            measurementId: "G-4J1V0208LJ"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        /* ============================= */
        /* ELEMENTS */
        /* ============================= */

        const courseName =
            document.getElementById("course-name");

        const lessonStatus =
            document.getElementById("lesson-status");

        const lessonTitle =
            document.getElementById("lesson-title");

        const lessonInstructor =
            document.getElementById("lesson-instructor");

        const lessonContent =
            document.getElementById("lesson-content");


        /* ============================= */
        /* GET LESSON ID */
        /* ============================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const lessonId =
            params.get("id");


        /* ============================= */
        /* AUTHENTICATION */
        /* ============================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }


                if (!lessonId) {

                    lessonStatus.textContent =
                        "Lesson not found.";

                    return;

                }


                loadLesson();

            }
        );


        /* ============================= */
        /* LOAD LESSON */
        /* ============================= */

        async function loadLesson() {

            try {

                const lessonRef =
                    doc(
                        db,
                        "lessons",
                        lessonId
                    );


                const lessonSnapshot =
                    await getDoc(
                        lessonRef
                    );


                if (!lessonSnapshot.exists()) {

                    lessonStatus.textContent =
                        "This lesson does not exist.";

                    return;

                }


                const lesson =
                    lessonSnapshot.data();


                /* ============================= */
                /* LESSON DATA */
                /* ============================= */

                lessonTitle.textContent =
                    lesson.title ||
                    "Untitled Lesson";


                lessonInstructor.textContent =
                    `👨‍🏫 Instructor: ${
                        lesson.instructor ||
                        "Unknown"
                    }`;


                lessonContent.textContent =
                    lesson.content ||
                    "No lesson content available.";


                lessonStatus.textContent =
                    "";


                /* ============================= */
                /* LOAD COURSE */
                /* ============================= */

                if (lesson.courseId) {

                    const courseRef =
                        doc(
                            db,
                            "courses",
                            lesson.courseId
                        );


                    const courseSnapshot =
                        await getDoc(
                            courseRef
                        );


                    if (
                        courseSnapshot.exists()
                    ) {

                        const course =
                            courseSnapshot.data();


                        courseName.textContent =
                            `📚 ${
                                course.title ||
                                "Course"
                            }`;

                    }

                }


            } catch (error) {

                console.error(
                    "Error loading lesson:",
                    error
                );


                lessonStatus.textContent =
                    "Unable to load this lesson.";

            }

        }


        /* ============================= */
        /* BACK BUTTON */
        /* ============================= */

        document
            .getElementById("back-btn")
            .addEventListener(
                "click",
                (event) => {

                    event.preventDefault();

                    window.history.back();

                }
            );

    </script>

</body>

</html>
```
